<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172b"><title>KAKKA GAME STUDIO</title><link rel="apple-touch-icon" sizes="180x180" href="./kakka-icon.png?v=2"><link rel="icon" type="image/png" href="./kakka-icon.png?v=2"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#eaf0ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#172443,#0b1020 65%);min-height:100vh}main{max-width:850px;margin:auto;padding:24px 16px 80px}h1{font-size:24px;margin:8px 0}h2{font-size:17px}p,.muted{color:#aebbd4}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{color:#79d7ff;font-size:12px;letter-spacing:.15em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat,.card,.panel{background:#19243b;border:1px solid #344360;border-radius:18px;padding:16px}.stat b{display:block;font-size:27px}.stat small{color:#aebbd4;font-size:11px}button{border:0;background:#577dff;color:white;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}button.secondary{background:#303f5c}button.danger{background:#673747}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar button{font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{cursor:pointer}.card h3{margin:10px 0;font-size:18px}.tag{display:inline-block;background:#2d4461;color:#a9e9ff;border-radius:30px;padding:5px 9px;font-size:11px}.progress{height:9px;background:#35415a;border-radius:12px;overflow:hidden;margin:14px 0 6px}.fill{height:100%;background:linear-gradient(90deg,#45c5e9,#8175ff)}.card p{font-size:13px;line-height:1.6}dialog{width:min(96vw,650px);max-height:90vh;overflow:auto;background:#17243a;border:1px solid #506182;border-radius:20px;color:#eaf0ff;padding:20px}dialog::backdrop{background:#000a}label{display:block;font-size:13px;color:#c9d5e8;margin-top:14px}input,textarea,select{width:100%;margin-top:6px;background:#0e182c;color:white;border:1px solid #506182;border-radius:10px;padding:12px;font:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #344360}.task input{width:auto;margin:0}.task span{flex:1}.task.done span{text-decoration:line-through;color:#8795ae}.note{font-size:12px;color:#aebbd4;line-height:1.7}.empty{padding:20px;color:#aebbd4;text-align:center}@media(min-width:700px){h1{font-size:30px}}</style></head><body><main><header><div><div class="eyebrow">PERSONAL DEVELOPMENT HQ</div><h1>🎮 KAKKA GAME STUDIO</h1><div class="muted">ゲーム企画・制作・テストをひとつに。</div></div><button onclick="openNew()">＋ 追加</button></header><section class="stats" id="stats"></section><div class="toolbar"><button class="secondary" onclick="setFilter('all')">すべて</button><button class="secondary" onclick="setFilter('公開済み')">公開済み</button><button class="secondary" onclick="setFilter('開発中')">開発中</button><button class="secondary" onclick="setFilter('企画中')">企画中</button></div><section class="cards" id="cards"></section><p class="note">※ 初期データはこれまでの会話を参考にした仮登録です。進捗率は推定ではなく、自由に設定できる管理用の数値です。編集内容はこのブラウザ内に保存されます。別端末との自動同期はありません。</p><div class="actions"><button class="secondary" onclick="exportData()">データを書き出す</button><button class="secondary" onclick="document.getElementById('importFile').click()">データを読み込む</button><input hidden id="importFile" type="file" accept="application/json" onchange="importData(event)"></div></main><dialog id="editor"><h2 id="dialogTitle">プロジェクト</h2><form id="form" onsubmit="save(event)"><input type="hidden" id="projectId"><label>ゲーム名<input id="name" required maxlength="100"></label><label>状態<select id="status"><option>企画中</option><option>開発中</option><option>テスト中</option><option>審査中</option><option>公開済み</option><option>保留</option></select></label><label>進捗（自己申告の目安）<input id="progress" type="number" min="0" max="100" value="0"></label><label>ゲームの概要<textarea id="summary"></textarea></label><label>次にやること<textarea id="next"></textarea></label><label>メモ・仕様<textarea id="memo"></textarea></label><h2>作業チェックリスト</h2><div id="tasks"></div><div class="actions"><input id="newTask" placeholder="新しい作業を入力" style="flex:1;min-width:160px"><button type="button" class="secondary" onclick="addTask()">作業追加</button></div><div class="actions"><button type="submit">保存する</button><button type="button" class="secondary" onclick="editor.close()">閉じる</button><button type="button" class="danger" id="deleteBtn" onclick="deleteProject()">削除</button></div></form></dialog><script>
const initial=[{id:1,name:'夜空のブロック崩し',status:'公開済み',progress:100,summary:'羊ブロックとオルゴールBGMのブロック崩し。広告なし。',next:'ストアの反応を確認する',memo:'公開済み。',tasks:[]},{id:2,name:'Slime Sort Puzzle',status:'公開済み',progress:100,summary:'スライムの並べ替えパズル。魔女の立ち絵、BGM・効果音あり。',next:'宣伝動画とストア分析を続ける',memo:'2026年10月公開。',tasks:[]},{id:3,name:'新作ブロックパズル',status:'開発中',progress:0,summary:'ステージ・チャレンジ・フリー、地獄モードなどを検討・実装。',next:'最新の審査状況と未完了作業を確認',memo:'進捗率は未設定。広告や審査の状況は編集して更新。',tasks:[]},{id:4,name:'異世界工場長',status:'企画中',progress:0,summary:'魔王城へ製品を出荷する魔物の工場経営ゲーム。資源争奪戦と手動・自動の戦闘を構想。',next:'最小限のゲームループを決める',memo:'性格の異なる仲間、昇進による指揮、ブランドと信頼性など。',tasks:[{text:'ゲームの基本ループを決める',done:false},{text:'戦闘画面の試作方針を決める',done:false}]},{id:5,name:'FX予測アプリ',status:'企画中',progress:0,summary:'為替ニュースと予測を日記風に表示するアプリ構想。',next:'画面構成と注意書きを整理',memo:'名称案：ひより日記／10分スコープ。',tasks:[]},{id:6,name:'インタラクティブ小説',status:'企画中',progress:0,summary:'10ターンの異世界物語。HPと複数エンディングを構想。',next:'現在の実装状況を確認',memo:'SwiftUI＋APIの構想・制作履歴あり。',tasks:[]}];
const key='kakka-studio-projects-v1';let data;try{const stored=JSON.parse(localStorage.getItem(key));data=Array.isArray(stored)?stored:initial}catch{data=initial}let filter='all';let taskDraft=[];const editor=document.getElementById('editor');function persist(){localStorage.setItem(key,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const published=data.filter(p=>p.status==='公開済み').length;document.getElementById('stats').innerHTML=`<div class="stat"><b>${data.length}</b><small>登録ゲーム</small></div><div class="stat"><b>${published}</b><small>公開済み</small></div><div class="stat"><b>${data.length-published}</b><small>その他</small></div>`;const list=data.filter(p=>filter==='all'||p.status===filter);document.getElementById('cards').innerHTML=list.length?list.map(p=>`<article class="card" onclick="openEdit(${Number(p.id)})"><span class="tag">${esc(p.status)}</span><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p><div class="progress"><div class="fill" style="width:${Math.min(100,Math.max(0,Number(p.progress)||0))}%"></div></div><div class="note">進捗 ${Number(p.progress)||0}% ${p.progress===0?'（未設定を含む）':''}</div><p>📌 次：${esc(p.next||'未設定')}</p></article>`).join(''):'<div class="empty">この状態のゲームはまだないよ。</div>'}function setFilter(f){filter=f;render()}function openNew(){openForm({id:'',name:'',status:'企画中',progress:0,summary:'',next:'',memo:'',tasks:[]})}function openEdit(id){const p=data.find(x=>x.id===id);if(p)openForm(p)}function openForm(p){document.getElementById('dialogTitle').textContent=p.id?'プロジェクト編集':'新しいゲーム';for(const field of ['id','name','status','progress','summary','next','memo'])document.getElementById(field==='id'?'projectId':field).value=p[field]??'';taskDraft=structuredClone(p.tasks||[]);drawTasks();document.getElementById('deleteBtn').hidden=!p.id;editor.showModal()}function drawTasks(){document.getElementById('tasks').innerHTML=taskDraft.map((t,i)=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="taskDraft[${i}].done=this.checked;drawTasks()"><span>${esc(t.text)}</span><button type="button" class="danger" onclick="taskDraft.splice(${i},1);drawTasks()">×</button></div>`).join('')}function addTask(){const el=document.getElementById('newTask');if(!el.value.trim())return;taskDraft.push({text:el.value.trim(),done:false});el.value='';drawTasks()}function save(e){e.preventDefault();const id=Number(document.getElementById('projectId').value)||Date.now();const p={id,name:document.getElementById('name').value.trim(),status:document.getElementById('status').value,progress:Math.min(100,Math.max(0,Number(document.getElementById('progress').value)||0)),summary:document.getElementById('summary').value,next:document.getElementById('next').value,memo:document.getElementById('memo').value,tasks:taskDraft};if(!p.name)return;const idx=data.findIndex(x=>x.id===id);if(idx>=0)data[idx]=p;else data.push(p);persist();render();editor.close()}function deleteProject(){const id=Number(document.getElementById('projectId').value);if(confirm('このゲームを削除する？')){data=data.filter(x=>x.id!==id);persist();render();editor.close()}}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kakka-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming)||!incoming.every(x=>x&&typeof x.name==='string'&&Array.isArray(x.tasks)))throw Error('形式が違います');if(confirm('現在のデータを読み込んだデータで置き換える？')){data=incoming;persist();render()}}catch{alert('読み込めないファイルです')}e.target.value=''}render();</script></body></html>
